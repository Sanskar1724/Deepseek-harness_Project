[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-ner"
version = "0.1.0"
description = "AI-Based Early Warning and Landslide Risk Monitoring System for NER, India"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SIH 2026 Team" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "GeoAlchemy2>=0.15",
  "alembic>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geojson-pydantic>=1.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "streamlit>=1.32",
  "streamlit-folium>=0.20",
  "folium>=0.15",
  "requests>=2.31",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.3",
  "mypy>=1.8",
  "types-requests",
]

[project.scripts]
landslide-api = "app.main:run"
landslide-ui = "frontend.app:main"

[tool.setuptools]
packages = ["app", "frontend"]

[tool.setuptools.package-dir]
app = "backend/app"
frontend = "frontend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "ml", "."]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests requiring a real database",
  "e2e: end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true